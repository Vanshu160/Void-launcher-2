name: Build LWJGL 3.3.3 (arm64, from PojavLauncherTeam's own Android build)

# Manual, because this is a slow native compile (libffi + FreeType + LWJGL's C modules) and is
# only needed again if we change the LWJGL version or the upstream build changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID: "1"
      LWJGL_BUILD_OFFLINE: "1"
      LWJGL_BUILD_ARCH: arm64
      SKIP_LIBFFI: "0"
      SKIP_FREETYPE: "0"
    steps:
      - name: Check out this repository (for the exact commit)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout PojavLauncherTeam/lwjgl3 (wip/rebase_3.3.3, their own working Android build)
        uses: actions/checkout@v6
        with:
          repository: PojavLauncherTeam/lwjgl3
          ref: wip/rebase_3.3.3
          path: lwjgl3

      # The Android command-line tools need JDK 17+. Use 17 only for the SDK/NDK steps below.
      - name: Set up JDK 17 (for the Android SDK tools)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the exact NDK version this project uses
        run: echo "y" | sdkmanager --install "ndk;29.0.14206865"

      # Switch to JDK 8 for the build itself, after the SDK tools have run.
      - name: Set up JDK 8 (the build's own Ant script requires it)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Run PojavLauncherTeam's own Android build script for arm64
        working-directory: lwjgl3
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: bash ci_build_android.bash

      - name: Collect the built native libraries
        run: |
          set -euo pipefail
          mkdir -p out
          cp lwjgl3/bin/out/*.so out/ 2>/dev/null || true

          # libopenal.so is not produced by LWJGL's Android build: the OpenAL binding is Java-only and has no C
          # sources. ci_build_android.bash downloads it from PojavLauncherTeam's jniLibs into
          # bin/libs/native/linux/arm64/org/lwjgl/openal/ and never copies it to bin/out, so it is copied here.
          # LWJGL's Library.loadNative("openal") needs it by name, so a release without it cannot start the game.
          OPENAL=lwjgl3/bin/libs/native/linux/arm64/org/lwjgl/openal/libopenal.so
          if [ ! -s "$OPENAL" ]; then
            echo "::error::$OPENAL is missing or empty"
            exit 1
          fi
          # A here-string instead of a pipe: grep -q exits on the first match, which would break a pipe under pipefail.
          if ! grep -q "Machine:.*AArch64" <<< "$(readelf -h "$OPENAL")"; then
            echo "::error::$OPENAL is not an AArch64 library"
            exit 1
          fi
          cp "$OPENAL" out/libopenal.so
          echo "libopenal.so from PojavLauncherTeam's jniLibs (not rebuilt here):"
          sha256sum out/libopenal.so
          ls -la out

      - name: Upload as a build artifact (always, so a failed release step still leaves this)
        uses: actions/upload-artifact@v7
        with:
          name: lwjgl-3.3.3-arm64-natives
          path: out/*.so
          if-no-files-found: error

      # Never overwrites or deletes anything: a unique tag per run, created on this exact commit.
      # The stable tag used by Lwjgl333Natives.kt is NOT touched here; promoting a build to it is a
      # separate, explicit step after the phone test.
      - name: Publish as a prerelease under a unique tag (no overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lwjgl-3.3.3-arm64-run${{ github.run_number }}"
          gh release create "$TAG" out/*.so \
            --target "$GITHUB_SHA" \
            --title "LWJGL 3.3.3 natives (arm64 Android), run ${{ github.run_number }}" \
            --notes "Built from PojavLauncherTeam/lwjgl3 at wip/rebase_3.3.3 using their own ci_build_android.bash, for arm64 (aarch64-linux-android) only, from commit ${{ github.sha }}. libopenal.so is PojavLauncherTeam's prebuilt OpenAL Soft (LGPL-2.0 or later upstream), copied unchanged; its SHA-256 is in the build log. Not yet promoted to the stable tag used by the app." \
            --prerelease
