name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: void-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          NAME="void-launcher-debug-${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          TAG="debug-build-${{ github.run_number }}"
          gh release create "$TAG" "$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Void Launcher debug build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}. Install it and enable installs from unknown sources." \
            --prerelease
